:root{
  --bg:#0a0a12;
  --surface:#11111d;
  --surface2:#151524;
  --ink:#f2f0e4;
  --muted:#9c9aa8;
  --line:#2a2a3d;
  --gold:#ffd700;
  --cyan:#00ccff;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0a12;
    --surface:#11111d;
    --ink:#f2f0e4;
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
  color:var(--ink)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding:var(--safe-area-inset-top) 0 0;
  overflow-x:clip
}

.top-rule{
  height:3px;
  background:var(--gold);
  max-width:1180px;
  margin:0 auto
}

main{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px 28px
}

.hero{
  padding:44px 0 34px;
  text-align:center;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  color:var(--cyan);
  font-size:11px;
  letter-spacing:.18em;
  font-weight:700
}

.eyebrow i{
  width:28px;
  height:1px;
  background:var(--gold);
  display:block
}

.hero h1{
  font-family:Orbitron,monospace;
  font-size:clamp(38px,7vw,76px);
  line-height:.95;
  letter-spacing:-.04em;
  margin:20px 0 18px;
  font-weight:900
}

.hero h1 b{
  color:var(--gold);
  font-weight:900
}

.subtitle{
  font-size:15px;
  line-height:1.7;
  color:#cfcdd8;
  margin:0
}

.subtitle strong{
  color:var(--gold);
  font-size:18px
}

.hero-meta{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:24px;
  flex-wrap:wrap
}

.hero-meta span{
  border:1px solid var(--line);
  padding:8px 12px;
  font-size:10px;
  letter-spacing:.14em;
  color:var(--muted)
}

.hero-meta span:first-child{
  color:var(--gold);
  border-color:#4a3f10
}

.cross-section{
  position:relative;
  padding:34px 0 18px
}

.cross-label{
  position:absolute;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted);
  font-weight:700
}

.top-label{
  top:16px;
  left:50%;
  transform:translateX(-50%)
}

.left-label{
  top:50%;
  left:0;
  transform:rotate(-90deg) translateY(-50%);
  transform-origin:left
}

.right-label{
  top:50%;
  right:0;
  transform:rotate(90deg) translateY(-50%);
  transform-origin:right
}

.bottom-label{
  bottom:2px;
  left:50%;
  transform:translateX(-50%)
}

.cross-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:auto auto auto;
  gap:14px;
  max-width:980px;
  margin:0 auto;
  position:relative
}

.cross-grid:before,.cross-grid:after{
  content:"";
  position:absolute;
  background:#3b3408;
  z-index:0;
  pointer-events:none
}

.cross-grid:before{
  left:50%;
  top:8%;
  bottom:8%;
  width:1px;
  transform:translateX(-50%)
}

.cross-grid:after{
  top:50%;
  left:8%;
  right:8%;
  height:1px;
  transform:translateY(-50%)
}

.role-card,.mitte{
  position:relative;
  z-index:1
}

.role-card{
  background:var(--surface);
  border:1px solid #39394e;
  padding:0
}

.role-card.role-top{
  border-top:3px solid var(--cyan)
}

.role-card.role-right{
  border-right:3px solid var(--gold)
}

.role-card.role-left{
  border-left:3px solid var(--gold)
}

.role-card.role-bottom{
  border-bottom:3px solid var(--cyan)
}

.role-inner{
  padding:20px
}

.role-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.role-no{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted)
}

.role-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--cyan)
}

.role-icon.gold{
  color:var(--gold)
}

.pole{
  font-family:Orbitron,sans-serif;
  font-size:28px;
  font-weight:900;
  letter-spacing:.04em;
  margin:14px 0 2px
}

.role-inner h3{
  font-family:Orbitron,sans-serif;
  font-size:14px;
  margin:0;
  color:var(--gold)
}

.tab{
  font-size:11px;
  color:var(--muted);
  margin:9px 0 14px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line)
}

.task{
  font-size:11px;
  letter-spacing:.1em;
  padding:10px 11px;
  background:#0a0a12;
  border:1px solid var(--line)
}

.task strong{
  color:var(--cyan);
  font-size:13px
}

.lists{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin:16px 0
}

.lists h4{
  font-size:9px;
  letter-spacing:.18em;
  color:var(--muted);
  margin:0 0 9px
}

.lists ul{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  gap:7px;
  font-size:11px;
  line-height:1.45;
  color:#d8d6e2
}

.lists li{
  display:flex;
  gap:6px
}

.lists li span{
  color:var(--cyan)
}

.lists ul.no li span{
  color:#ff6b6b
}

.fulfilled{
  border-top:1px solid var(--gold);
  padding-top:11px;
  font-size:11px;
  line-height:1.5;
  color:var(--gold);
  font-weight:700
}

.mitte{
  grid-row:2;
  grid-column:2;
  background:var(--gold);
  color:#0a0a12;
  padding:4px;
  text-align:center;
  display:flex
}

.mitte-inner{
  border:1px solid #0a0a12;
  width:100%;
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.mitte-no{
  font-family:Orbitron,sans-serif;
  font-size:11px;
  letter-spacing:.3em;
  margin:9px 0 0;
  font-weight:700
}

.mitte-big{
  font-family:Orbitron,sans-serif;
  font-size:68px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.08em
}

.mitte p{
  font-size:11px;
  line-height:1.6;
  margin:10px 0
}

.mitte-divider{
  width:42px;
  height:2px;
  background:#0a0a12;
  margin:4px 0
}

.crown{
  font-size:11px!important
}

.crown span{
  font-family:Orbitron,sans-serif;
  font-weight:900;
  letter-spacing:.15em
}

.crown-note{
  font-size:10px!important;
  opacity:.8
}

.rule-line{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.18em;
  text-align:center;
  margin:16px 0 42px
}

.rule-line:before,.rule-line:after{
  content:"";
  height:1px;
  background:var(--gold);
  flex:1
}

.roller{
  padding:18px 0 46px;
  border-top:1px solid var(--line)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:22px
}

.kicker{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--cyan);
  font-weight:700
}

.section-head h2{
  font-family:Orbitron,sans-serif;
  font-size:clamp(32px,5vw,52px);
  margin:8px 0 0;
  line-height:1
}

.section-head p{
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
  text-align:right;
  margin:0
}

.depth-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.depth-card{
  border:1px solid var(--line);
  background:var(--surface);
  padding:18px;
  min-height:220px
}

.depth-card:nth-child(2),.depth-card:nth-child(4){
  border-top:2px solid var(--cyan)
}

.depth-card:nth-child(1),.depth-card:nth-child(3){
  border-top:2px solid var(--gold)
}

.depth-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px
}

.depth-icon{
  color:var(--gold)
}

.depth-card h3{
  font-family:Orbitron,sans-serif;
  font-size:22px;
  margin:42px 0 6px
}

.depth-tag{
  color:var(--cyan);
  font-size:11px;
  margin-bottom:12px
}

.depth-desc{
  font-size:13px;
  line-height:1.5;
  margin:0
}

.depth-note{
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  margin:14px 0 0;
  padding-top:12px;
  border-top:1px solid var(--line)
}

.hammer-box{
  margin-top:14px;
  border:1px solid #514410;
  background:#17130a;
  padding:18px 20px;
  display:grid;
  grid-template-columns:140px 1fr auto;
  gap:20px;
  align-items:center
}

.hammer-box strong{
  color:var(--gold);
  font-size:12px;
  letter-spacing:.15em
}

.hammer-box p{
  margin:0;
  font-size:13px
}

.hammer-box span{
  font-size:11px;
  color:var(--muted)
}

.check{
  padding:24px 0 38px;
  border-top:1px solid var(--line)
}

.check-score{
  text-align:right
}

.check-score b{
  display:block;
  font-family:Orbitron,sans-serif;
  font-size:28px;
  color:var(--gold)
}

.check-score span{
  font-size:10px;
  letter-spacing:.16em;
  color:var(--muted)
}

.check-score.ok b{
  color:var(--cyan)
}

.check-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.check-row{
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  padding:16px;
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:14px;
  align-items:center;
  text-align:left;
  cursor:pointer;
  width:100%;
  font-family:inherit
}

.check-row:hover{
  border-color:var(--gold)
}

.check-key{
  font-family:Orbitron,sans-serif;
  font-size:13px;
  color:var(--cyan)
}

.check-text{
  display:flex;
  flex-direction:column;
  gap:4px
}

.check-text strong{
  font-size:13px
}

.check-text small{
  font-size:11px;
  color:var(--muted)
}

.check-answer{
  font-family:Orbitron,sans-serif;
  font-size:17px;
  color:var(--gold)
}

.check-row.is-no .check-answer{
  color:#ff6b6b
}

.check-hint{
  grid-column:1/-1;
  font-size:9px;
  color:#6d6b7a;
  letter-spacing:.08em
}

.result{
  margin-top:14px;
  border:1px solid var(--gold);
  display:flex;
  align-items:center;
  gap:18px;
  padding:20px;
  background:#17130a
}

.result-mark{
  font-size:34px;
  color:var(--gold)
}

.result strong{
  font-size:14px;
  line-height:1.5
}

.result p{
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
  margin:6px 0 0
}

.result-41{
  margin-left:auto;
  font-family:Orbitron,sans-serif;
  font-size:34px;
  font-weight:900;
  color:var(--gold)
}

.result-ok{
  border-color:var(--cyan);
  background:#071a20
}

.result-ok .result-mark,.result-ok .result-41{
  color:var(--cyan)
}

footer{
  border-top:1px solid var(--line);
  padding:22px 0 8px;
  text-align:center
}

.footer-line{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  font-size:12px
}

.footer-line i{
  width:22px;
  height:1px;
  background:var(--gold);
  display:block
}

.footer-line b{
  color:var(--gold)
}

footer p{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.1em;
  margin:18px 0 0
}

@media(max-width:700px){
  main{
    padding:0 14px 22px
  }

  .hero{
    padding-top:30px
  }

  .eyebrow{
    gap:8px;
    font-size:9px
  }

  .eyebrow i{
    width:14px
  }

  .hero-meta span{
    font-size:9px
  }

  .cross-label{
    display:none
  }

  .cross-grid{
    grid-template-columns:1fr;
    grid-template-rows:auto
  }

  .cross-grid:before,.cross-grid:after{
    display:none
  }

  .role-card,.mitte{
    grid-column:auto!important;
    grid-row:auto!important
  }

  .mitte{
    order:-1
  }

  .role-top{
    order:1
  }

  .role-left{
    order:2
  }

  .role-right{
    order:3
  }

  .role-bottom{
    order:4
  }

  .lists{
    grid-template-columns:1fr
  }

  .section-head{
    align-items:start;
    flex-direction:column
  }

  .section-head p{
    text-align:left
  }

  .depth-grid{
    grid-template-columns:1fr 1fr
  }

  .depth-card{
    min-height:0
  }

  .depth-card h3{
    margin-top:26px
  }

  .hammer-box{
    grid-template-columns:1fr;
    gap:8px
  }

  .check-list{
    grid-template-columns:1fr
  }

  .check-row{
    grid-template-columns:58px 1fr auto
  }

  .result{
    align-items:start
  }

  .result-41{
    display:none
  }

  .footer-line{
    gap:9px
  }
}

@media(max-width:420px){
  .depth-grid{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:34px
  }

  .check-row{
    padding:14px 12px
  }

  .check-text small{
    line-height:1.4
  }
}
</style>
